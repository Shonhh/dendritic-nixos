config_version = 19

[bar.default]
background_opacity = 1.00
capsule = false
capsule_opacity = 0.0
capsule_padding = 4
capsule_border = ""
capsule_radius = 6
center = [ "workspaces" ]
contact_shadow = false
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "clock", "session" ]
font_weight = 400
margin_edge = 0
margin_ends = 0
panel_overlap = 0
radius = 0
shadow = false
start = [ "control-center", "left-gap", "launcher", "left-gap", "clipboard", "left-gap", "sysmon", "left-gap", "media" ]
widget_spacing = 8

[battery]
warning_threshold = 20

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 3

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 768.0
    cy = 841.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
launch_apps_custom_command = "uwsm-app -- $CMD"
settings_show_advanced = true
settings_window_translucent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"
    save_to_file = false

    [shell.launcher]
    width = 640

[osd]
position = "top_center"
orientation = "horizontal"
offset_y = 48
hide_delay_ms = 1200
background_opacity = 0.94
border = true
border_color = "outline_variant"
border_width = 1.0
follow_focused_output = true

[notification]
position = "top_right"
offset_x = 8
offset_y = 8
width = 360
background_opacity = 0.94
border = true
border_color = "outline_variant"
border_width = 1.0
follow_focused_output = true

[theme]
mode = "dark"
wallpaper_scheme = "m3-content"

[wallpaper]
enabled = false

[weather]
unit = "imperial"

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "{:%I:%M %p}"

[widget.control-center]
glyph = "grid-dots"

[widget.media]
title_scroll = "on_hover"

[widget.session]
icon_color = "error"
scale = 1.1

[widget.sysmon]
stat = "ram_used"

[widget.tray]
hidden = ["Udiskie"]

[widget.workspaces]
font_weight = 600
label_source = "name"
max_label_chars = 20

[widget.left-gap]
type = "spacer"
length = 12
capsule = false
interactive = false
