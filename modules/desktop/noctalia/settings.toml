config_version = 8

[bar.default]
background_opacity = 0.79999998211860657
capsule = true
capsule_opacity = 0.4999999888241291
capsule_padding = 3.0
capsule_radius = 6
center = [ "workspaces" ]
end = [ "bluetooth", "tray", "notifications", "network", "battery", "volume", "brightness", "clock", "session" ]
font_family = "FiraCode Nerd Font"
font_weight = 400
margin_edge = 0
margin_ends = 0
panel_overlap = 0
radius = 0
shadow = false
start = [ "control-center", "launcher", "sysmon", "media", "clipboard" ]
widget_spacing = 8

[battery]
warning_threshold = 20

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 3

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 768.0
    cy = 841.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
font_family = "FiraCode Nerd Font"
launch_apps_custom_command = "uwsm-app -- $CMD"
settings_show_advanced = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    transparency_mode = "glass"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
enabled = false

[weather]
unit = "imperial"

[widget.battery]
capsule = true
capsule_opacity = 0.5
display_mode = "graphic"

[widget.bluetooth]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0

[widget.clock]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
capsule_radius = 6
format = "{:%I:%M %p}"

[widget.control-center]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
glyph = "grid-dots"

[widget.launcher]
capsule = true
capsule_opacity = 0.0
capsule_padding = 3

[widget.media]
capsule_opacity = 0.5
capsule_radius = 6
title_scroll = "on_hover"

[widget.network]
capsule = true
capsule_opacity = 0.5

[widget.notifications]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0

[widget.session]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
icon_color = "error"
scale = 1.1000000000000001

[widget.sysmon]
anchor = true
capsule_opacity = 0.5
capsule_radius = 6
stat = "ram_used"

[widget.tray]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
hidden = [ "Udiskie" ]

[widget.volume]
capsule = true
capsule_opacity = 0.5

[widget.workspaces]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
display = "name"
font_weight = 600
max_label_chars = 20